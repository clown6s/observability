# 只采集 observability 这个 compose 项目的容器日志，直推 Loki
# （避免误采宿主机上其它项目的 mysql/redis/postgres 等，并规避 Loki 拒绝过期样本）
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    pipeline_stages:
      # 容器标准输出通常带 docker json 格式前缀，去掉使其成为纯日志行
      - docker: {}
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # 只匹配本项目容器（compose 项目名 = 目录名 observability）
        filters:
          - name: label
            values: ["com.docker.compose.project=observability"]
    relabel_configs:
      # 排除 promtail 自身，避免自采噪音
      - source_labels: ['__meta_docker_container_name']
        regex: '/promtail'
        action: drop
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'